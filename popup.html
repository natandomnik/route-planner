<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trasa do Maps</title>
  <link rel="stylesheet" href="popup.css">
  <script src="transport-maps-parser.js" defer></script>
  <script src="providers.js" defer></script>
  <script src="settings.js" defer></script>
  <script src="gemini.js" defer></script>
  <script src="ai.js" defer></script>
  <script src="postal-lab.js" defer></script>
  <script src="hubs.js" defer></script>
  <script src="popup.js" defer></script>
</head>
<body class="route-popup">
<main>
  <header><span class="mark" aria-hidden="true">A<span>→</span>B</span><div><h1>Trasa do Maps</h1></div><a id="settings" class="text-button settings-link" href="options.html" target="_blank" rel="noopener">Ustawienia ⚙</a></header>
  <p id="selected-model" class="hint selected-model" aria-live="polite"></p>
  <section aria-labelledby="source-title">
    <div class="section-head"><h2 id="source-title">01 / Wklej zlecenie lub trasę</h2><button id="clear" class="text-button" type="button">Wyczyść</button></div>
    <label class="sr-only" for="source">Tekst zlecenia</label>
    <textarea id="source" rows="3" maxlength="50000" placeholder="loading: DE, 36039, Fulda&#10;unloading: PL, 64-117, Krzycko Wielkie"></textarea>
    <div class="source-actions"><button id="parse-ai" type="button" class="primary">Rozpoznaj przez AI</button><button id="parse" type="button" class="text-button">Przelicz lokalnie</button></div>
  </section>
  <p id="status" role="status" aria-live="polite"></p>
  <section id="result" hidden aria-labelledby="result-title">
    <div class="section-head"><h2 id="result-title">02 / Sprawdź i popraw trasę</h2><span id="count"></span></div>
    <div class="section-head"><span id="recognition" class="hint"></span><button id="undo-ai" type="button" class="text-button" hidden>Cofnij analizę AI</button></div>
    <p id="reorder-help" class="sr-only">Na uchwycie użyj strzałek w górę i w dół, aby przenieść punkt.</p>
    <ol id="points" aria-label="Punkty trasy"></ol>
    <div class="point-actions">
      <button id="add" class="add-point" type="button"><span class="plus-circle" aria-hidden="true">+</span> Dodaj punkt</button>
      <button id="copy-points" class="copy-points" type="button" title="Sprawdź kody w Groq i kopiuj punkty" aria-label="Sprawdź kody w Groq i kopiuj punkty">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h3"/></svg>
      </button>
    </div>
    <details id="warnings-box" hidden><summary id="warnings-title">Sprawdź rozpoznanie</summary><ul id="warnings"></ul></details>
    <details id="ignored-box" hidden><summary>Pominięte pola zlecenia</summary><ul id="ignored"></ul></details>
    <button id="open" class="primary open-button" type="button">Otwórz trasę w Google Maps →</button>
  </section>
</main>
</body>
</html>
